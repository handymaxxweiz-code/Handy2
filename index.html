<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>handymaxx</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#1a1a1a;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overscroll-behavior:none}
input,select,textarea{outline:none;-webkit-appearance:none;appearance:none}
input[type=file]{display:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px}

/* Variables */
:root{
  --green:#7ab929;
  --green-dark:#5a8f1a;
  --green-light:#9dd43a;
  --bg:#1a1a1a;
  --bg2:#242424;
  --bg3:#2e2e2e;
  --border:#383838;
  --text:#f0f0f0;
  --text2:#aaa;
  --text3:#666;
}

#app{height:100%;display:flex;flex-direction:column}

/* Header */
.hdr{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:#1a1a1a;border-bottom:2px solid var(--green);flex-shrink:0;z-index:50}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text{font-size:18px;font-weight:900;letter-spacing:-0.02em}
.logo-text span{color:var(--green)}
.logo-sub{font-size:9px;color:var(--text3);letter-spacing:.12em;margin-top:1px}

/* Content */
.content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;background:#1a1a1a}

/* Bottom Nav */
.bnav{display:flex;border-top:1px solid var(--border);background:#1a1a1a;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;color:var(--text3);font-size:9px;letter-spacing:.04em;cursor:pointer;font-family:inherit;transition:color .15s}
.nb.on{color:var(--green)}
.nb .ni{font-size:22px;line-height:1}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--bg2);border-radius:12px;padding:16px;border:1px solid var(--border);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--green)}
.stat-label{font-size:10px;color:var(--text3);letter-spacing:.1em;margin-bottom:8px;text-transform:uppercase}
.stat-val{font-size:22px;font-weight:800}
.stat-unit{font-size:10px;color:var(--text2);margin-top:2px}

/* Search */
.search-box{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:13px;width:100%;margin-bottom:10px;font-family:inherit}
.search-box:focus{border-color:var(--green)}
.search-box::placeholder{color:var(--text3)}

/* Filter pills */
.pills{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{padding:6px 14px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid var(--border);color:var(--text3);background:transparent;font-family:inherit;white-space:nowrap;transition:all .15s}
.pill.on{background:var(--green);color:#fff;border-color:var(--green)}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:10px;cursor:pointer;transition:all .15s;-webkit-user-select:none}
.card:active{border-color:var(--green);transform:scale(0.99)}
.card-thumb{width:50px;height:50px;border-radius:10px;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.card-thumb img{width:100%;height:100%;object-fit:cover}
.card-info{flex:1;min-width:0}
.card-name{font-weight:700;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:11px;color:var(--text3)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;background:var(--bg3);color:var(--text2);font-weight:500}
.tag.gr{background:#7ab92922;color:var(--green)}
.tag.bl{background:#3b82f622;color:#60a5fa}
.tag.ye{background:#f59e0b22;color:#f59e0b}
.tag.re{background:#ef444422;color:#f87171}
.tag.pu{background:#8b5cf622;color:#a78bfa}
.card-right{text-align:right;flex-shrink:0}

/* FAB */
.fab{position:fixed;bottom:74px;right:18px;width:56px;height:56px;border-radius:50%;background:var(--green);border:none;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px #7ab92966;z-index:100;transition:transform .15s}
.fab:active{transform:scale(0.92)}

/* Forms */
.form-title{font-size:20px;font-weight:800;margin-bottom:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.fw{grid-column:1/-1}
.fl{font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.fi{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:11px 13px;font-family:inherit;font-size:13px;border-radius:10px;width:100%;transition:border-color .15s}
.fi:focus{border-color:var(--green)}
.fi::placeholder{color:var(--text3)}
select.fi option{background:var(--bg2)}
textarea.fi{resize:vertical;min-height:70px}

/* Photo upload */
.photo-up{border:2px dashed var(--border);border-radius:12px;height:120px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:16px;overflow:hidden;background:var(--bg2);position:relative;flex-direction:column;gap:6px;color:var(--text3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.photo-up:active{border-color:var(--green)}
.photo-up img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.multi-photos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pt{width:70px;height:70px;border-radius:10px;overflow:hidden;position:relative;flex-shrink:0}
.pt img{width:100%;height:100%;object-fit:cover}
.pt .dl{position:absolute;top:2px;right:2px;background:#ef4444;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer}
.apb{width:70px;height:70px;border-radius:10px;background:var(--bg2);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;color:var(--text3);flex-shrink:0}

/* Buttons */
.btn-p{background:var(--green);color:#fff;border:none;padding:14px 18px;font-family:inherit;font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;width:100%;transition:opacity .15s}
.btn-p:active{opacity:.85}
.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border);padding:13px 14px;font-family:inherit;font-size:12px;border-radius:10px;cursor:pointer}
.btn-d{background:transparent;color:#f87171;border:1px solid #f8717133;padding:13px 14px;font-family:inherit;font-size:12px;border-radius:10px;cursor:pointer}
.btn-s{background:var(--green)22;color:var(--green);border:1px solid var(--green)44;padding:13px 14px;font-family:inherit;font-size:12px;border-radius:10px;cursor:pointer;flex:1}
.btn-row{display:flex;gap:8px;margin-top:18px;padding-bottom:80px;flex-wrap:wrap}
.btn-sm{padding:8px 12px;font-size:11px}

/* Detail */
.detail-img{width:100%;height:200px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:60px;margin-bottom:16px}
.detail-img img{width:100%;height:100%;object-fit:cover}
.detail-imgs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.detail-imgs::-webkit-scrollbar{display:none}
.detail-img-sm{width:100px;height:100px;border-radius:10px;overflow:hidden;flex-shrink:0}
.detail-img-sm img{width:100%;height:100%;object-fit:cover}
.detail-name{font-size:22px;font-weight:800;margin-bottom:8px}
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.price-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px}
.dk{font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.dv{font-size:13px}
.dsect{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.dsect-title{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--green);text-transform:uppercase;margin-bottom:12px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drow{display:flex;flex-direction:column;gap:3px}

/* Log */
.log-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.log-time{font-size:9px;color:var(--text3);margin-bottom:4px;letter-spacing:.04em}
.log-txt{font-size:12px;line-height:1.5}
.log-who{color:var(--green);font-weight:600}

/* Login */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:32px 24px;gap:20px;background:var(--bg)}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:12px}
.login-logo-icon{width:80px;height:80px;background:var(--green);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 8px 32px #7ab92955}
.login-logo-text{font-size:32px;font-weight:900;letter-spacing:-0.03em}
.login-logo-text span{color:var(--green)}
.login-sub{font-size:10px;color:var(--text3);letter-spacing:.16em;text-transform:uppercase;text-align:center}
.worker-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.worker-btn{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-family:inherit;font-size:14px;color:var(--text);cursor:pointer;text-align:left;font-weight:700;display:flex;align-items:center;gap:12px;width:100%;transition:border-color .15s}
.worker-btn:active{border-color:var(--green)}
.worker-av{width:38px;height:38px;border-radius:50%;background:var(--green)33;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:4px 0}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--bg3);border:2px solid var(--border);transition:all .15s}
.pin-dot.on{background:var(--green);border-color:var(--green)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:260px}
.pin-key{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;font-size:22px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit;color:var(--text);transition:all .1s}
.pin-key:active{background:var(--green);color:#fff;border-color:var(--green)}

/* Setup card */
.setup-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.setup-title{font-size:10px;color:var(--green);letter-spacing:.1em;margin-bottom:10px;font-weight:700;text-transform:uppercase}

/* Misc */
.empty{text-align:center;padding:60px 0;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-txt{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.sect-title{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text)}
.invest-bar{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}

.fade{animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.load{text-align:center;padding:60px 0;color:var(--text3);font-size:12px;letter-spacing:.08em;text-transform:uppercase}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 20px;border-radius:20px;font-size:12px;font-weight:600;z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px #7ab92966}
.toast.on{opacity:1}

/* Buch kategorie farben */
.buch-cat{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--text2)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div id="pa" style="display:none"></div>
<style>
@media print{
  body>*{display:none!important}
  #pa{display:block!important;margin:0;padding:0}
}
</style>
<script>
// ══ CONFIG ══════════════════════════════════════════════════
var SB='https://sqndtizvtbhxrxbjyypy.supabase.co';
var KEY='sb_publishable_RqRbaE6BPIpa9UfCB9E8Dg_sQOhgXoX';

// ══ STATE ═══════════════════════════════════════════════════
var user=JSON.parse(sessionStorage.getItem('hm')||'null');
var tab='dash',eid=null,fd={};
var AG=[],AR=[],AM=[],AL=[],AB=[];
var gf='Alle',rf='Alle',gs='',rs='',abf='Alle';
var lstep='sel',luser=null,pin='';
var SREP=['Ausstehend','In Arbeit','Warten auf Teile','Bereit','Abgeschlossen'];
var BKAT=['Miete','Strom/Internet','Ersatzteile','Werkzeug','Marketing','Sonstiges'];
var TC={Ausstehend:'ye','In Arbeit':'bl','Warten auf Teile':'re',Bereit:'pu',Abgeschlossen:'gr'};

// ══ API ══════════════════════════════════════════════════════
function req(table,method,body,qs){
  var sep=(qs&&qs.indexOf('?')===0)?'&':'?';
  var url=SB+'/rest/v1/'+table+(qs||'')+sep+'apikey='+KEY;
  return fetch(url,{
    method:method||'GET',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:body?JSON.stringify(body):undefined
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){console.warn(table,t);return[]});
    return r.text().then(function(t){return t?JSON.parse(t):[]});
  }).catch(function(e){console.warn(e.message);return[]});
}
function get(t,q){return req(t,'GET',null,q)}
function post(t,b){return req(t,'POST',b)}
function patch(t,id,b){return req(t,'PATCH',b,'?id=eq.'+id)}
function del(t,id){return req(t,'DELETE',null,'?id=eq.'+id)}
function log(a,d){if(user)post('aktivitaeten',{mitarbeiter_id:user.id,aktion:a,details:d})}

// ══ UPLOAD ══════════════════════════════════════════════════
function upload(dataUrl,pfx){
  return fetch(dataUrl).then(function(r){return r.blob()}).then(function(blob){
    var name=(pfx||'f')+'_'+Date.now()+'.jpg';
    return fetch(SB+'/storage/v1/object/fotos/'+name,{
      method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'image/jpeg'},body:blob
    }).then(function(r){return r.ok?SB+'/storage/v1/object/public/fotos/'+name:dataUrl});
  }).catch(function(){return dataUrl});
}
function compress(file,cb){
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'),w=img.width,h=img.height,M=700;
      if(w>M||h>M){if(w>h){h=h*M/w;w=M}else{w=w*M/h;h=M}}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.75));
    };img.src=e.target.result;
  };r.readAsDataURL(file);
}

// ══ HELPERS ══════════════════════════════════════════════════
function h(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fd_(s){if(!s)return'—';try{return new Date(s).toLocaleDateString('de-DE')}catch(e){return s}}
function ft_(s){if(!s)return'—';try{var d=new Date(s);return d.toLocaleDateString('de-DE')+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}catch(e){return s}}
function mm(){var m={};AM.forEach(function(x){m[x.id]=x.name});return m}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2300)}

// ══ LOAD ════════════════════════════════════════════════════
function loadAll(){
  return Promise.all([
    get('geraete','?order=erstellt_am.desc'),
    get('reparaturen','?order=erstellt_am.desc'),
    get('mitarbeiter','?order=name.asc'),
    get('aktivitaeten','?order=zeitpunkt.desc&limit=100'),
    get('buchhaltung','?order=erstellt_am.desc')
  ]).then(function(r){AG=r[0]||[];AR=r[1]||[];AM=r[2]||[];AL=r[3]||[];AB=r[4]||[]});
}

// ══ RENDER ROOT ══════════════════════════════════════════════
function render(){
  var app=document.getElementById('app');
  if(!user){rLogin(app);return}
  var isAdmin=user.rolle==='admin';
  var isBuch=user.rolle==='buchhalter';
  if(isBuch){
    app.innerHTML=
      hdrHtml('🧾 <span style="color:var(--green)">BUCHHALTER</span>')+
      '<div class="content" id="mc"><div class="load">● LADEN</div></div>'+
      '<div class="bnav">'+
        '<button class="nb on" id="bnb"><span class="ni">🧾</span>Rechnungen</button>'+
        '<button class="nb" id="logoutbtn"><span class="ni">🔓</span>Logout</button>'+
      '</div>';
    document.getElementById('logoutbtn').onclick=function(){user=null;sessionStorage.removeItem('hm');lstep='sel';render()};
    document.getElementById('bnb').onclick=buchLaden;
    buchLaden();return;
  }
  app.innerHTML=
    hdrHtml('👤 <span style="color:var(--green)">'+h(user.name)+'</span>'+(isAdmin?' <span style="font-size:9px;background:var(--green);color:#fff;padding:2px 6px;border-radius:4px;vertical-align:middle">ADMIN</span>':''))+
    '<div class="content" id="mc"><div class="load">● LADEN</div></div>'+
    '<div class="bnav">'+
      nb2('dash','📊','Dashboard')+nb2('ger','📱','Geräte')+nb2('rep','🔧','Reparatur')+
      (isAdmin?nb2('log','📋','Protokoll')+nb2('set','👥','Team'):'')+
      nb2('buch','🧾','Buchhaltung')+
      '<button class="nb" id="logoutbtn"><span class="ni">🔓</span>Logout</button>'+
    '</div>';
  document.getElementById('logoutbtn').onclick=function(){user=null;sessionStorage.removeItem('hm');lstep='sel';render()};
  bindNav();
  goTab(tab);
}

function hdrHtml(sub){
  return '<div class="hdr"><div class="logo">'+
    '<div class="logo-icon">📱</div>'+
    '<div><div class="logo-text">handy<span>maxx</span></div>'+
    '<div class="logo-sub">'+sub+'</div></div>'+
  '</div><div id="hbtn"></div></div>';
}
function nb2(t,ico,lbl){return'<button class="nb'+(tab===t?' on':'')+'" data-tab="'+t+'"><span class="ni">'+ico+'</span>'+lbl+'</button>'}
function bindNav(){document.querySelectorAll('.nb[data-tab]').forEach(function(b){b.onclick=function(){goTab(b.getAttribute('data-tab'))}})}

function goTab(t){
  tab=t;eid=null;fd={};
  var mc=document.getElementById('mc');
  var hb=document.getElementById('hbtn');
  if(!mc)return;
  mc.innerHTML='<div class="load">● LADEN</div>';
  if(hb)hb.innerHTML='';
  document.querySelectorAll('.nb[data-tab]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===t)});
  loadAll().then(function(){
    mc.className='content fade';
    if(t==='dash')rDash(mc);
    else if(t==='ger')rGer(mc);
    else if(t==='rep')rRep(mc);
    else if(t==='log')rLog(mc);
    else if(t==='set')rSet(mc);
    else if(t==='buch')rBuch(mc);
  });
}

// ══ DASHBOARD ════════════════════════════════════════════════
function rDash(el){
  var la=AG.filter(function(g){return g.status==='Auf Lager'}).length;
  var vk=AG.filter(function(g){return g.status==='Verkauft'}).length;
  var gw=AG.filter(function(g){return g.status==='Verkauft'}).reduce(function(s,g){return s+(parseFloat(g.verkaufpreis)||0)-(parseFloat(g.ankaufpreis)||0)},0);
  var iv=AG.filter(function(g){return g.status==='Auf Lager'}).reduce(function(s,g){return s+(parseFloat(g.ankaufpreis)||0)},0);
  var or=AR.filter(function(r){return r.status!=='Abgeschlossen'}).length;
  var ru=AR.filter(function(r){return r.status==='Abgeschlossen'}).reduce(function(s,r){return s+(parseFloat(r.preis)||0)},0);
  var m=mm();
  el.innerHTML=
    '<div class="stats">'+
      stat('LAGER',la,'Geräte','#60a5fa')+stat('GEWINN',gw.toFixed(0)+' €','Realisiert','#7ab929')+
      stat('INVESTIERT',iv.toFixed(0)+' €','Im Lager','#f59e0b')+stat('REPARATUREN',or,'Offen','#a78bfa')+

function rGer(el){

function rBuch(el){
  var isBuch=user&&user.rolle==='buchhalter';
  var total=AB.reduce(function(s,b){return s+(parseFloat(b.betrag)||0)},0);
  var now=new Date();
  var monat=AB.filter(function(b){if(!b.datum)return false;var d=new Date(b.datum);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).reduce(function(s,b){return s+(parseFloat(b.betrag)||0)},0);
  var flt=AB.filter(function(b){return abf==='Alle'||b.kategorie===abf});
  var hb=document.getElementById('hbtn');
  if(hb&&!isBuch){var kb=document.createElement('button');kb.className='btn-g btn-sm';kb.textContent='🤖 KI Abgleich';kb.onclick=function(){rKiAbgleich(el)};hb.innerHTML='';hb.appendChild(kb)}
  var html=
    '<div class="stats" style="grid-template-columns:1fr 1fr 1fr">'+
      stat('AUSGABEN',total.toFixed(0)+' €','Gesamt','#f87171')+

      stat('BELEGE',AB.length,'Dokumente','#a78bfa')+
    '</div>'+
    '<div class="pills">'+['Alle'].concat(BKAT).map(function(f){return'<button class="pill'+(abf===f?' on':'')+'" data-abf="'+h(f)+'">'+f+'</button>'}).join('')+'</div>';
  if(!flt.length)html+='<div class="empty"><div class="empty-icon">🧾</div><div class="empty-txt">Keine Belege</div></div>';

    html+='<div class="card" data-bid="'+b.id+'">'+
      '<div class="card-thumb" style="font-size:26px">'+(b.datei_url&&b.datei_typ==='image'?'<img src="'+h(b.datei_url)+'">':b.datei_url?'📄':'🧾')+'</div>'+

    '</div>';

  el.querySelectorAll('[data-bid]').forEach(function(c){c.onclick=function(){rBuchDetail(c.getAttribute('data-bid'))}});

// ══ KI ABGLEICH ══════════════════════════════════════════════
function rKiAbgleich(el){
  var hb=document.getElementById('hbtn');
  if(hb){var bk=document.createElement('button');bk.className='btn-g btn-sm';bk.textContent='← Zurück';bk.onclick=function(){goTab('buch')};hb.innerHTML='';hb.appendChild(bk)}
  el.className='content fade';
  el.innerHTML=
    '<div class="form-title">🤖 KI Abgleich</div>'+
    '<div style="background:#7ab92911;border:1px solid #7ab92933;border-radius:12px;padding:14px;margin-bottom:16px;font-size:12px;color:var(--text2);line-height:1.7">'+
      'Lade deinen <strong style="color:var(--green)">Kontoauszug als PDF</strong> hoch. Die KI vergleicht alle Zahlungen mit deinen Rechnungen.'+
    '</div>'+
    '<div class="photo-up" id="kpv"><span style="font-size:30px">📄</span><span>Kontoauszug PDF hochladen</span></div>'+
    '<input type="file" id="kfi" accept="application/pdf,image/*">'+
    '<div id="kst" style="margin:12px 0;font-size:12px;color:var(--text3);text-align:center"></div>'+
    '<div id="ker"></div>';
  document.getElementById('kpv').onclick=function(){document.getElementById('kfi').click()};
  document.getElementById('kfi').onchange=function(){
    var f=this.files[0];if(!f)return;
    document.getElementById('kst').innerHTML='<span style="color:#f59e0b">⏳ PDF wird analysiert…</span>';
    var reader=new FileReader();
    reader.onload=function(e){
      var base64=e.target.result.split(',')[1];
      var rechnungen=AB.map(function(b,i){return(i+1)+'. '+b.titel+' | '+b.kategorie+' | '+b.betrag+'€ | '+b.datum+(b.datei_url?' | Beleg vorhanden':'')}).join('\n');
      var prompt='Ich habe folgende Rechnungen/Ausgaben:\n\n'+rechnungen+'\n\nAnalysiere den beigefügten Kontoauszug und vergleiche mit meinen Rechnungen:\n- Welche Rechnung wurde wann bezahlt\n- Ob Beträge übereinstimmen\n- Welche noch NICHT bezahlt wurden\n- Unbekannte Abbuchungen\n\nAntworte strukturiert auf Deutsch.';
      fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:[
          {type:f.type==='application/pdf'?'document':'image',source:{type:'base64',media_type:f.type,data:base64}},
          {type:'text',text:prompt}
        ]}]})
      }).then(function(r){return r.json()}).then(function(data){
        document.getElementById('kst').innerHTML='<span style="color:var(--green)">✓ Analyse abgeschlossen</span>';
        var txt=data.content&&data.content[0]?data.content[0].text:'Keine Antwort.';
        var lines=txt.split('\n');
        var html='<div class="dsect"><div class="dsect-title">🤖 KI Analyse</div>';
        lines.forEach(function(line){
          if(!line.trim())return;
          var c='var(--text)',fw='400';
          if(line.match(/^#+/)||line.match(/^\*\*/)){c='var(--green)';fw='700';line=line.replace(/^#+\s*/,'').replace(/\*\*/g,'')}
          else if(line.includes('✓')||line.toLowerCase().includes('bezahlt'))c='#4ade80';
          else if(line.includes('✗')||line.toLowerCase().includes('nicht bezahlt')||line.toLowerCase().includes('offen'))c='#f87171';
          else if(line.toLowerCase().includes('unbekannt'))c='#f59e0b';
          html+='<div style="font-size:12px;color:'+c+';font-weight:'+fw+';line-height:1.8;padding:1px 0">'+h(line)+'</div>';
        });
        html+='</div><button class="btn-p" style="margin-top:12px" id="kexp">📥 Als PDF exportieren</button>';
        document.getElementById('ker').innerHTML=html;
        document.getElementById('kexp').onclick=function(){
          var win=window.open('','_blank');
          win.document.write('<html><head><title>KI Abgleich handymaxx</title><style>body{font-family:sans-serif;padding:24px;max-width:800px;color:#333}h1{color:#7ab929}pre{white-space:pre-wrap;line-height:1.8;font-size:14px}</style></head>');
          win.document.write('<body><h1>🤖 KI Kontoauszug Abgleich</h1><p>Erstellt: '+new Date().toLocaleDateString('de-DE')+'</p><hr><pre>'+txt+'</pre></body></html>');
          win.document.close();win.print();
        };
      }).catch(function(e){document.getElementById('kst').innerHTML='<span style="color:#f87171">⚠ Fehler: '+h(e.message)+'</span>'});
    };
    reader.readAsDataURL(f);
    var pv=document.getElementById('kpv');if(pv)pv.innerHTML='<span style="font-size:28px">📄</span><span style="font-size:11px">'+h(f.name)+'</span>';
  };
}

  app.innerHTML='<div style="min-height:100vh;background:#1a1a1a;padding:24px;display:flex;flex-direction:column;align-items:center;gap:20px">'+
    '<div style="display:flex;align-items:center;gap:10px">'+
      '<div style="width:44px;height:44px;background:#7ab929;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px">📱</div>'+
      '<div style="font-size:22px;font-weight:900"><span style="color:#7ab929">handy</span>maxx</div>'+
    '</div>'+
    '<div id="rep-status" style="width:100%;max-width:400px"><div class="load">● LADEN</div></div>'+
  '</div>';
  get('reparaturen','?id=eq.'+repId).then(function(data){
    var r=data&&data[0];
    var el=document.getElementById('rep-status');
    if(!r){el.innerHTML='<div style="color:#f87171;text-align:center">Reparatur nicht gefunden.</div>';return}
    var TC2={Ausstehend:{c:'#f59e0b',ico:'⏳'},
              'In Arbeit':{c:'#60a5fa',ico:'🔧'},
              'Warten auf Teile':{c:'#f87171',ico:'📦'},
              Bereit:{c:'#7ab929',ico:'✅'},
              Abgeschlossen:{c:'#4ade80',ico:'🎉'}};
    var st=TC2[r.status]||{c:'#aaa',ico:'❓'};
    el.innerHTML=
      '<div style="background:#242424;border:1px solid #383838;border-radius:16px;padding:20px">'+
        '<div style="font-size:10px;color:#666;letter-spacing:.1em;margin-bottom:8px">REPARATURSTATUS</div>'+
        '<div style="font-size:20px;font-weight:800;margin-bottom:4px">'+h(r.kundenname)+'</div>'+
        '<div style="font-size:14px;color:#aaa;margin-bottom:20px">'+h(r.geraet)+'</div>'+
        '<div style="display:flex;align-items:center;gap:12px;background:#1a1a1a;border-radius:12px;padding:16px;margin-bottom:16px">'+
          '<div style="font-size:36px">'+st.ico+'</div>'+
          '<div><div style="font-size:18px;font-weight:800;color:'+st.c+'">'+r.status+'</div>'+
          '<div style="font-size:11px;color:#666;margin-top:2px">Aktueller Status</div></div>'+
        '</div>'+
        (r.preis?'<div style="background:#7ab92922;border:1px solid #7ab92944;border-radius:10px;padding:14px;text-align:center"><div style="font-size:10px;color:#7ab929;margin-bottom:4px">PREIS</div><div style="font-size:24px;font-weight:900;color:#7ab929">'+r.preis+' €</div></div>':'')+
        '<div style="font-size:11px;color:#555;text-align:center;margin-top:16px">handymaxx.at · Professionelle Reparaturen seit 2009</div>'+
      '</div>';
  });
  return true;
}

// ══ PRINT AREA ════════════════════════════════════════════════

function rLog(el){
  var m=mm();
  el.innerHTML='<div class="sect-title">AKTIVITÄTSPROTOKOLL</div>'+
    (AL.length?AL.map(function(l){return'<div class="log-item"><div class="log-time">'+ft_(l.zeitpunkt)+'</div><div class="log-txt"><span class="log-who">'+(m[l.mitarbeiter_id]||'?')+'</span> · <strong>'+h(l.aktion||'')+'</strong>'+(l.details?' — '+h(l.details):'')+'</div></div>'}).join(''):'<div class="empty"><div class="empty-icon">📋</div><div class="empty-txt">Keine Einträge</div></div>')+
    '<div style="height:80px"></div>';
}

// ══ EINSTELLUNGEN ════════════════════════════════════════════
function rSet(el){
  var html='<div class="sect-title">TEAM VERWALTEN</div>';
  AM.forEach(function(m){
    html+='<div class="card">'+
      '<div class="worker-av" style="width:42px;height:42px;border-radius:50%;background:var(--green)22;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0">'+m.name.charAt(0).toUpperCase()+'</div>'+
      '<div class="card-info"><div class="card-name">'+h(m.name)+'</div><div class="card-meta">'+(m.rolle==='admin'?'👑 Admin':'Mitarbeiter')+' · PIN: '+m.pin+'</div></div>'+
      '<button class="btn-g btn-sm" data-pin="'+m.id+'" data-pname="'+h(m.name)+'">🔑</button>'+
      (m.id!==user.id?'<button class="btn-d btn-sm" data-dm="'+m.id+'" data-dmname="'+h(m.name)+'">🗑</button>':'')+
    '</div>';
  });
  html+='<div class="setup-card" style="margin-top:16px"><div class="setup-title">Neuen Mitarbeiter hinzufügen</div>'+
    '<div class="form-grid">'+
      fg('NAME','<input class="fi" id="nn" placeholder="Max Mustermann">')+
      fg('PIN','<input class="fi" id="np" placeholder="1234" inputmode="numeric" maxlength="6">')+
      fg('ROLLE','<select class="fi" id="nr"><option>mitarbeiter</option><option>admin</option></select>')+
    '</div>'+
    '<button class="btn-p" style="margin-top:12px" id="addbtn">Hinzufügen</button></div>'+
    '<div style="height:80px"></div>';
  el.innerHTML=html;
  el.querySelectorAll('[data-pin]').forEach(function(b){
    b.onclick=function(){
      var neu=prompt('Neuer PIN für '+b.getAttribute('data-pname')+':');
      if(!neu||neu.length<4){if(neu)toast('⚠ Mind. 4 Stellen!');return}
      patch('mitarbeiter',b.getAttribute('data-pin'),{pin:neu}).then(function(){log('PIN geändert',b.getAttribute('data-pname'));toast('✓ PIN geändert');goTab('set')});
    };
  });
  el.querySelectorAll('[data-dm]').forEach(function(b){
    b.onclick=function(){
      if(!confirm(b.getAttribute('data-dmname')+' löschen?'))return;
      del('mitarbeiter',b.getAttribute('data-dm')).then(function(){log('Mitarbeiter gelöscht',b.getAttribute('data-dmname'));toast('🗑 Gelöscht');goTab('set')});
    };
  });
  document.getElementById('addbtn').onclick=function(){
    var n=(document.getElementById('nn').value||'').trim();
    var p=(document.getElementById('np').value||'').trim();
    var ro=document.getElementById('nr').value;
    if(!n||!p){toast('⚠ Name und PIN eingeben!');return}
    post('mitarbeiter',{name:n,pin:p,rolle:ro}).then(function(){log('Mitarbeiter hinzugefügt',n);toast('✓ '+n+' hinzugefügt');goTab('set')});
  };
}

// ══ LOGIN ════════════════════════════════════════════════════
function rLogin(app){
  app.innerHTML='<div class="login-wrap" id="lw"></div>';
  if(lstep==='sel')rSel();else rPin();
}
function rSel(){
  get('mitarbeiter','?order=name.asc').then(function(ws){
    var el=document.getElementById('lw');if(!el)return;
    el.innerHTML=
      '<div class="login-logo">'+
        '<div class="login-logo-icon">📱</div>'+
        '<div class="login-logo-text">handy<span>maxx</span></div>'+
        '<div style="font-size:10px;color:var(--text3);letter-spacing:.14em;text-transform:uppercase">Professionelle Reparaturen seit 2009</div>'+
      '</div>'+
      '<div class="login-sub">Wer bist du?</div>'+
      '<div class="worker-list">'+
      ((!ws||!ws.length)?'<div style="color:var(--text3);font-size:12px;text-align:center">Keine Mitarbeiter.<br>SQL in Supabase ausführen.</div>':
      ws.map(function(w){return'<button class="worker-btn" data-wid="'+w.id+'" data-wname="'+h(w.name)+'" data-wpin="'+w.pin+'" data-wrolle="'+w.rolle+'">'+
        '<div class="worker-av">'+w.name.charAt(0).toUpperCase()+'</div>'+
        h(w.name)+'<span style="font-size:11px;color:var(--text3);margin-left:auto">'+(w.rolle==='admin'?'👑':'')+'</span>'+
      '</button>'}).join(''))+
      '</div>';
    el.querySelectorAll('[data-wid]').forEach(function(b){
      b.onclick=function(){
        luser={id:b.getAttribute('data-wid'),name:b.getAttribute('data-wname'),pin:b.getAttribute('data-wpin'),rolle:b.getAttribute('data-wrolle')};
        pin='';lstep='pin';rPin();
      };
    });
    // Fehleranzeige wenn leer
    if(!ws||!ws.length){
      setTimeout(function(){
        var lw=document.getElementById('lw');
        if(lw)lw.innerHTML+='<button class="btn-p" style="max-width:200px;margin-top:8px" onclick="rSel()">🔄 Nochmal versuchen</button>';
      },100);
    }
  });
}
function rPin(){
  var el=document.getElementById('lw');if(!el)return;
  el.innerHTML=
    '<div class="login-logo">'+
      '<div class="login-logo-icon">📱</div>'+
      '<div class="login-logo-text">handy<span>maxx</span></div>'+
    '</div>'+
    '<div style="font-size:18px;font-weight:700">Hallo, <span style="color:var(--green)">'+h(luser.name)+'</span> 👋</div>'+
    '<div class="login-sub">PIN eingeben</div>'+
    '<div class="pin-dots" id="dots">'+[0,1,2,3].map(function(i){return'<div class="pin-dot'+(i<pin.length?' on':'')+'"></div>'}).join('')+'</div>'+
    '<div id="perr" style="color:#f87171;font-size:11px;min-height:16px;text-align:center"></div>'+
    '<div class="pin-pad">'+[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(function(k){return'<button class="pin-key"'+(k===''?' style="visibility:hidden"':'')+' data-k="'+k+'">'+k+'</button>'}).join('')+'</div>'+
    '<button class="btn-g" id="pbk" style="margin-top:8px;font-size:12px">← Andere Person</button>';
  el.querySelectorAll('[data-k]').forEach(function(b){
    b.onclick=function(){
      var k=b.getAttribute('data-k');
      if(k==='⌫')pin=pin.slice(0,-1);else if(pin.length<6)pin+=k;
      document.querySelectorAll('.pin-dot').forEach(function(d,i){d.classList.toggle('on',i<pin.length)});
      if(pin.length>=luser.pin.length){
        if(pin===luser.pin){
          user={id:luser.id,name:luser.name,rolle:luser.rolle};
          sessionStorage.setItem('hm',JSON.stringify(user));
          lstep='sel';pin='';luser=null;if(!checkRepUrl())render();
        } else {
          var e=document.getElementById('perr');if(e)e.textContent='Falscher PIN!';
          pin='';setTimeout(function(){var e=document.getElementById('perr');if(e)e.textContent=''},1500);
        }
      }
    };
  });
  document.getElementById('pbk').onclick=function(){lstep='sel';pin='';rLogin(document.getElementById('app'))};
}

render();
</script>
</body>
</html>
